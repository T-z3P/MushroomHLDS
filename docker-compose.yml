version: '3.8'

services:
  ui:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mushroom-hlds
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-1338}:1337"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/hlds/servers:/hlds_data
      - ./data:/app/data
    environment:
      - PORT=1337
      - NODE_ENV=production