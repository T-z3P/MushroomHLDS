services:
  hlds-panel:
    build: ./backend
    container_name: hlds_panel
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/hlds/servers:/hlds_data
      - ./data:/app/data
    environment:
      - PORT=3000
      - NODE_ENV=production